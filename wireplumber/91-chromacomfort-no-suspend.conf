# Keep Bluetooth A2DP sinks from being suspended by WirePlumber's normal idle
# timeout. This is useful for a dedicated always-on ChromaComfort audio bridge.
monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
